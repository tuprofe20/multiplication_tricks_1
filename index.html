<head>

    <title>TuProfe20 Lab - Mates Mágicas (Sonic Edition)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body { margin: 0; padding: 0; overflow-x: hidden; user-select: none; }
        .font-fun { font-family: 'Nunito', sans-serif; }
        
        @keyframes slideInRight { 0% { opacity: 0; transform: translateX(25px); } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes confettiExplosion { 0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; } }
        
        @keyframes starRadialExplosion {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; filter: brightness(1) drop-shadow(0 0 5px rgba(251,191,36,0.8)); }
            20% { transform: translate(calc(var(--tx) * 0.2), calc(var(--ty) * 0.2)) scale(var(--s)) rotate(calc(var(--rot) * 0.2)); opacity: 1; filter: brightness(1.5) drop-shadow(0 0 15px rgba(251,191,36,1)); }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; filter: brightness(1) drop-shadow(0 0 0 rgba(251,191,36,0)); }
        }

        @keyframes jellyPop {
            0% { transform: scale3d(.3, .3, .3); opacity: 0; }
            20% { transform: scale3d(1.2, 1.2, 1.2); }
            40% { transform: scale3d(.9, .9, .9); }
            60% { transform: scale3d(1.1, 1.1, 1.1); opacity: 1; }
            80% { transform: scale3d(.95, .95, .95); }
            100% { transform: scale3d(1, 1, 1); opacity: 1; }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg) scale(1.1); }
        }

        @keyframes sonicIdle { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-7px) rotate(-2deg); } }
        @keyframes sonicSpin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes sonicJump { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-18px) scale(1.08) rotate(3deg); } }
        @keyframes sonicThink { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg) translateY(-3px); } }
        @keyframes ringSpin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        @keyframes quillWave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
        @keyframes shoeTap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-12deg) translateY(-2px); } }
        @keyframes auraPulse { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.18); opacity: 0.9; } }
        @keyframes sparkSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @keyframes pointsFloat {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            80% { transform: translateY(-40px) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(0.8); opacity: 0; }
        }

        .animate-slideInRight { animation: slideInRight 0.3s ease-out forwards; }
        .animate-confettiExplosion { animation: confettiExplosion 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-starRadialExplosion { animation: starRadialExplosion 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-jellyPop { animation: jellyPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-wiggle { animation: wiggle 1.5s ease-in-out infinite; }
        .animate-sonicIdle { animation: sonicIdle 2.2s ease-in-out infinite; }
        .animate-sonicJump { animation: sonicJump 0.9s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .animate-sonicThink { animation: sonicThink 2s ease-in-out infinite; }
        .animate-sonicSpin { animation: sonicSpin 0.35s linear infinite; }
        .animate-pointsFloat { animation: pointsFloat 1.5s ease-out forwards; }
        .animate-quillWave { animation: quillWave 1.6s ease-in-out infinite; transform-origin: 65px 55px; }
        .animate-shoeTap { animation: shoeTap 0.55s ease-in-out infinite; transform-origin: 85px 128px; }
        .animate-auraPulse { animation: auraPulse 1.2s ease-in-out infinite; }
        .animate-sparkSpin { animation: sparkSpin 4s linear infinite; }
        
        /* Custom scrollbar for small screens if needed */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.45); border-radius: 9999px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

        const Star = (p) => <Icon {...p} paths='<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 3v4"/><path d="M17 5h4"/>' />;

        const Flame = (p) => <Icon {...p} paths='<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>' />;

        // ==========================================

            },

            },

                badge: 'ab × 11',
                gradient: 'from-sky-400/30 to-indigo-600/40',

            },
            {

                number: 'Truco 10',
                level: 'Nivel 4 • Descomponer',

                subtitle: 'Piensa en 6 = 5 + 1. Calcula ×5 y suma el número.',
                badge: '×6',
                gradient: 'from-lime-400/30 to-green-600/40',
                border: 'border-lime-400/60',
                shadow: 'hover:shadow-[0_20px_40px_rgba(132,204,22,0.45)]'
            }
        ];

        // 8 Ejemplos Guiados por cada truco
        const EXERCISES = {
            trick1: [ [34, 10], [34, 100], [7, 1000], [45, 10], [18, 100], [92, 10], [6, 100], [25, 1000] ],
            trick4: [ [23, 4], [15, 4], [31, 4], [14, 4], [25, 4], [42, 4], [18, 4], [35, 4] ],
            trick5: [ [12, 8], [15, 8], [11, 8], [20, 8], [13, 8], [25, 8], [14, 8], [30, 8] ],
            trick6: [ [7, 9], [4, 9], [6, 9], [8, 9], [3, 9], [5, 9], [9, 9], [2, 9] ],
            trick7: [ [34, 9], [15, 9], [22, 9], [41, 9], [18, 9], [25, 9], [52, 9], [61, 9] ],
            trick8: [ [7, 11], [3, 11], [5, 11], [8, 11], [2, 11], [6, 11], [9, 11], [4, 11] ],
            trick9: [ [23, 11], [35, 11], [42, 11], [53, 11], [71, 11], [26, 11], [62, 11], [81, 11] ],
            trick10: [ [24, 6], [14, 6], [16, 6], [22, 6], [12, 6], [18, 6], [30, 6], [42, 6] ]
        };

        // 8 Ejercicios de Práctica por cada truco
        const PRACTICE_EXERCISES = {
            trick1: [ [56, 10], [19, 100], [4, 1000], [83, 10], [72, 100], [15, 1000], [90, 10], [31, 100] ],
            trick4: [ [16, 4], [21, 4], [24, 4], [32, 4], [27, 4], [45, 4], [19, 4], [50, 4] ],
            trick5: [ [16, 8], [10, 8], [21, 8], [17, 8], [22, 8], [19, 8], [24, 8], [40, 8] ],
            trick6: [ [5, 9], [8, 9], [3, 9], [7, 9], [9, 9], [4, 9], [6, 9], [2, 9] ],
            trick7: [ [14, 9], [23, 9], [31, 9], [45, 9], [16, 9], [28, 9], [51, 9], [72, 9] ],
            trick8: [ [6, 11], [9, 11], [4, 11], [8, 11], [2, 11], [7, 11], [5, 11], [3, 11] ],
            trick9: [ [34, 11], [45, 11], [27, 11], [63, 11], [54, 11], [72, 11], [18, 11], [80, 11] ],
            trick10: [ [16, 6], [26, 6], [20, 6], [28, 6], [32, 6], [34, 6], [40, 6], [50, 6] ]
        };

        const AudioController = {
            ctx: null, muted: false,
            init: function() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.ctx = new AudioContext();
            },
            play: function(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                
                if (type === 'pop') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'pop-reverse') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(250, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'ring') {
                    // Classic Sonic Ring chime (B5 -> E6)
                    const freqs = [987.77, 1318.51];
                    freqs.forEach((f, idx) => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.type = 'sine';
                        o.frequency.setValueAtTime(f, now + idx * 0.07);
                        o.connect(g); g.connect(this.ctx.destination);
                        g.gain.setValueAtTime(0.22, now + idx * 0.07);
                        g.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.07 + 0.35);
                        o.start(now + idx * 0.07);
                        o.stop(now + idx * 0.07 + 0.35);
                    });
                } else if (type === 'success') {
                    const notes = [587.33, 783.99, 987.77, 1174.66, 1567.98];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                        o.type = 'triangle'; o.frequency.value = freq;
                        o.connect(g); g.connect(this.ctx.destination);
                        const startTime = now + (i * 0.065);
                        g.gain.setValueAtTime(0, startTime); g.gain.linearRampToValueAtTime(0.22, startTime + 0.04); g.gain.linearRampToValueAtTime(0, startTime + 0.38);
                        o.start(startTime); o.stop(startTime + 0.38);
                    });
                } else if (type === 'swoosh') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(320, now); osc.frequency.exponentialRampToValueAtTime(65, now + 0.18);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                }
            },
            toggleMute: function() { this.muted = !this.muted; return this.muted; }
        };

        const InteractiveSonicBackground = memo(() => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                const handleResize = () => {
                    if (!canvas) return;
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', handleResize);

                const symbols = ['×10', '×4', '×8', '×9', '×11', '×6', '⚡', '★', '000'];
                const items = Array.from({ length: 34 }).map(() => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 1.1,
                    vy: -0.6 - Math.random() * 1.2,
                    size: 16 + Math.random() * 20,
                    isRing: Math.random() > 0.42,
                    symbol: symbols[Math.floor(Math.random() * symbols.length)],
                    angle: Math.random() * Math.PI * 2,
                    spinSpeed: 0.02 + Math.random() * 0.04,
                    alpha: 0.18 + Math.random() * 0.25
                }));

                const bursts = [];
                const mouse = { x: -9999, y: -9999 };

                const onMove = (e) => {
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    mouse.x = clientX;
                    mouse.y = clientY;
                };

                const onClick = (e) => {
                    const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                    const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                    for (let i = 0; i < 8; i++) {
                        const a = (Math.PI * 2 * i) / 8 + Math.random() * 0.3;
                        const spd = 2.5 + Math.random() * 4;
                        bursts.push({
                            x: clientX,
                            y: clientY,
                            vx: Math.cos(a) * spd,
                            vy: Math.sin(a) * spd - 1.5,
                            r: 8 + Math.random() * 5,
                            life: 1
                        });
                    }
                };

                window.addEventListener('mousemove', onMove);
                window.addEventListener('touchmove', onMove, { passive: true });
                window.addEventListener('mousedown', onClick);

                const render = () => {
                    ctx.clearRect(0, 0, width, height);

                    // Draw interactive floating items
                    items.forEach(p => {
                        const dx = p.x - mouse.x;
                        const dy = p.y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 130 && dist > 0) {
                            const force = (130 - dist) / 130;
                            p.x += (dx / dist) * force * 5.5;
                            p.y += (dy / dist) * force * 5.5;
                        }

                        p.x += p.vx;
                        p.y += p.vy;
                        p.angle += p.spinSpeed;

                        if (p.y < -50) { p.y = height + 40; p.x = Math.random() * width; }
                        if (p.x < -50) p.x = width + 40;
                        if (p.x > width + 50) p.x = -40;

                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.globalAlpha = p.alpha;

                        if (p.isRing) {
                            const scaleX = Math.max(0.25, Math.abs(Math.cos(p.angle)));
                            ctx.scale(scaleX, 1);
                            ctx.beginPath();
                            ctx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
                            ctx.strokeStyle = '#fde047';
                            ctx.lineWidth = 4.5;
                            ctx.shadowColor = '#f59e0b';
                            ctx.shadowBlur = 10;
                            ctx.stroke();
                        } else {
                            ctx.font = `900 ${p.size}px Nunito, sans-serif`;
                            ctx.fillStyle = '#ffffff';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(p.symbol, 0, 0);
                        }
                        ctx.restore();
                    });

                    // Draw click ring bursts
                    for (let i = bursts.length - 1; i >= 0; i--) {
                        const b = bursts[i];
                        b.x += b.vx;
                        b.y += b.vy;
                        b.vy += 0.12;
                        b.life -= 0.025;
                        if (b.life <= 0) {
                            bursts.splice(i, 1);
                            continue;
                        }
                        ctx.save();
                        ctx.globalAlpha = b.life;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                        ctx.strokeStyle = '#facc15';
                        ctx.lineWidth = 3.5;
                        ctx.shadowColor = '#fbbf24';
                        ctx.shadowBlur = 8;
                        ctx.stroke();
                        ctx.restore();
                    }

                    animId = requestAnimationFrame(render);
                };
                render();

                return () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', handleResize);
                    window.removeEventListener('mousemove', onMove);

        const Confetti = memo(() => {

                                <ellipse cx="109" cy="60" rx="8.5" ry="5.5" transform="rotate(-14 109 60)" fill="#0f172a" />
