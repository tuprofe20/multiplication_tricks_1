        // ====================================================
        // MOTOR DE CÁLCULO Y PASOS PARA LOS 8 TRUCOS DEL PDF
        // ====================================================
        const getTrickData = (mode, numA, numB) => {
            switch (mode) {
                case 'trick1': {
                    // Multiplicar por 10, 100 y 1000
                    const zerosCount = String(numB).length - 1;
                    const zerosStr = '0'.repeat(zerosCount);
                    const ans = numA * numB;
                    return {
                        maxSteps: 3,
                        ans,
                        zerosCount,
                        zerosStr,
                        explanations: [
                            <p>¡Velocidad Supersónica! ⚡ Vamos a multiplicar <span className="text-indigo-600 font-black">{numA} × {numB}</span> sin hacer cuentas largas.</p>,
                            <p><strong>Paso 1:</strong> Cuenta cuántos ceros tiene el <span className="bg-amber-400 text-slate-900 px-2.5 py-0.5 rounded-xl font-black">{numB}</span>. ¡Tiene exactamente <strong>{zerosCount} {zerosCount === 1 ? 'cero' : 'ceros'}</strong>! 🔍</p>,
                            <p><strong>Paso 2:</strong> Escribe el <span className="text-indigo-600 font-black">{numA}</span> y agrégale <span className="bg-emerald-500 text-white px-2.5 py-0.5 rounded-xl font-black">{zerosStr}</span> al final. 👉</p>,
                            <p><strong>¡Meta alcanzada!:</strong> ¡Fusión lista! El resultado instantáneo es <span className="text-amber-500 font-black">{ans}</span>. 🦔💨</p>
                        ]
                    };
                }
                case 'trick4': {
                    // Multiplicar por 4: Duplica dos veces
                    const d1 = numA * 2;
                    const ans = d1 * 2;
                    return {
                        maxSteps: 3,
                        ans,
                        d1,
                        explanations: [
                            <p>¡El Poder del Doble! ✌️ Multiplicar <span className="text-indigo-600 font-black">{numA} × 4</span> es duplicar el número <strong>dos veces</strong>.</p>,
                            <p><strong>Paso 1 (Primer Doble):</strong> Duplicamos el {numA} ({numA} × 2). ¡Eso nos da <span className="bg-cyan-500 text-white px-2.5 py-0.5 rounded-xl font-black">{d1}</span>! ⚡</p>,
                            <p><strong>Paso 2 (Segundo Doble):</strong> Ahora duplicamos el {d1} ({d1} × 2). ¡Nos da <span className="bg-emerald-500 text-white px-2.5 py-0.5 rounded-xl font-black">{ans}</span>! 🚀</p>,
                            <p><strong>¡Boom Sónico!:</strong> {numA} → {d1} → <span className="text-amber-500 font-black">{ans}</span>. ¡Calculado en un parpadeo! 🏆</p>
                        ]
                    };
                }
                case 'trick5': {
                    // Multiplicar por 8: Duplica tres veces
                    const d1 = numA * 2;
                    const d2 = d1 * 2;
                    const ans = d2 * 2;
                    return {
                        maxSteps: 4,
                        ans,
                        d1,
                        d2,
                        explanations: [
                            <p>¡Triple Turbo Sónico! 🌀 Para multiplicar <span className="text-indigo-600 font-black">{numA} × 8</span>, duplicamos el número <strong>tres veces</strong>.</p>,
                            <p><strong>Paso 1 (1.er Doble):</strong> Sacamos el doble de {numA} → ¡obtenemos <span className="bg-cyan-500 text-white px-2.5 py-0.5 rounded-xl font-black">{d1}</span>! 💨</p>,
                            <p><strong>Paso 2 (2.do Doble):</strong> Sacamos el doble de {d1} → ¡llegamos a <span className="bg-indigo-600 text-white px-2.5 py-0.5 rounded-xl font-black">{d2}</span>! ⚡</p>,
                            <p><strong>Paso 3 (3.er Doble):</strong> Sacamos el doble de {d2} → ¡nos da <span className="bg-emerald-500 text-white px-2.5 py-0.5 rounded-xl font-black">{ans}</span>! 🔥</p>,
                            <p><strong>¡Récord Mundial!:</strong> {numA} → {d1} → {d2} → <span className="text-amber-500 font-black">{ans}</span>. ¡Eres imparable! 🌟</p>
                        ]
                    };
                }
                case 'trick6': {
                    // Multiplicar por 9: una cifra
                    const left = numA - 1;
                    const right = 9 - left;
                    const ans = numA * 9;
                    return {
                        maxSteps: 3,
                        ans,
                        left,
                        right,
                        explanations: [
                            <p>¡El Secreto del 9! 🖐️ Vamos a resolver <span className="text-indigo-600 font-black">{numA} × 9</span> con un truco mágico.</p>,
                            <p><strong>Paso 1:</strong> Réstale 1 a la cifra ({numA} − 1). ¡Obtenemos <span className="bg-indigo-600 text-white px-2.5 py-0.5 rounded-xl font-black">{left}</span> para la primera cifra! 👈</p>,
                            <p><strong>Paso 2:</strong> ¿Cuánto le falta a {left} para llegar a 9? (9 − {left} = <span className="bg-emerald-500 text-white px-2.5 py-0.5 rounded-xl font-black">{right}</span>). 👉</p>,
                            <p><strong>¡Magia Completa!:</strong> Junta el {left} y el {right} para formar <span className="text-amber-500 font-black">{ans}</span>. ✨</p>
                        ]
                    };
                }
                case 'trick7': {
                    // Multiplicar por 9: cualquier número
                    const times10 = numA * 10;
                    const ans = times10 - numA;
                    return {
                        maxSteps: 3,
                        ans,
                        times10,
                        explanations: [
                            <p>¡Atajo Inteligente! 🧠 Como <strong>9 = 10 − 1</strong>, multiplicar <span className="text-indigo-600 font-black">{numA} × 9</span> es súper fácil.</p>,
                            <p><strong>Paso 1:</strong> Primero multiplica {numA} por 10 (solo agrega un cero): ¡nos da <span className="bg-indigo-600 text-white px-2.5 py-0.5 rounded-xl font-black">{times10}</span>! ⚡</p>,
                            <p><strong>Paso 2:</strong> Al {times10} réstale una vez el número original (<span className="bg-rose-500 text-white px-2.5 py-0.5 rounded-xl font-black">{times10} − {numA}</span>). 🎯</p>,
                            <p><strong>¡Resultado Perfecto!:</strong> {times10} − {numA} = <span className="text-amber-500 font-black">{ans}</span>. ¡Cálculo mental nivel Pro! 🏅</p>
                        ]
                    };
                }
                case 'trick8': {
                    // Multiplicar por 11: una cifra
                    const ans = numA * 11;
                    return {
                        maxSteps: 2,
                        ans,
                        explanations: [
                            <p>¡El truco más rápido del universo! 🌌 Multiplicar una sola cifra (<span className="text-indigo-600 font-black">{numA}</span>) por 11.</p>,
                            <p><strong>Paso 1:</strong> El 11 duplica visualmente a la cifra: pon un <span className="bg-indigo-600 text-white px-2.5 py-0.5 rounded-xl font-black">{numA}</span> al lado de otro <span className="bg-emerald-500 text-white px-2.5 py-0.5 rounded-xl font-black">{numA}</span>. 👯</p>,
                            <p><strong>¡Así de fácil!:</strong> ¡Al repetir el {numA} obtenemos <span className="text-amber-500 font-black">{ans}</span> al instante! ⚡</p>
                        ]
                    };
                }
                case 'trick9': {
                    // Multiplicar por 11: dos cifras (a+b < 10)
                    const a = Math.floor(numA / 10);
                    const b = numA % 10;
                    const mid = a + b;
                    const ans = numA * 11;
                    return {
                        maxSteps: 3,
                        ans,
                        a,
                        b,
                        mid,
                        explanations: [
                            <p>¡Sándwich Numérico ×11! 🥪 Vamos a calcular <span className="text-indigo-600 font-black">{numA} × 11</span> abriendo sus cifras.</p>,
                            <p><strong>Paso 1:</strong> Separa las cifras <span className="bg-indigo-600 text-white px-2.5 py-0.5 rounded-xl font-black">{a}</span> y <span className="bg-indigo-600 text-white px-2.5 py-0.5 rounded-xl font-black">{b}</span> en los extremos dejando un espacio al centro. ↔️</p>,
                            <p><strong>Paso 2:</strong> Suma ambas cifras ({a} + {b} = <span className="bg-emerald-500 text-white px-2.5 py-0.5 rounded-xl font-black">{mid}</span>) y coloca el {mid} en el centro. 🎯</p>,
                            <p><strong>¡Súper Fusión!:</strong> Une {a}, {mid} y {b} → ¡La respuesta es <span className="text-amber-500 font-black">{ans}</span>! 🎉</p>
                        ]
                    };
                }
                case 'trick10': {
                    // Multiplicar por 6: piensa en 6 = 5 + 1
                    const x5 = numA * 5;
                    const ans = x5 + numA;
                    return {
                        maxSteps: 3,
                        ans,
                        x5,
                        explanations: [
                            <p>¡Descomponer para Ganar! 🧩 Piensa que <strong>6 = 5 + 1</strong> para resolver <span className="text-indigo-600 font-black">{numA} × 6</span>.</p>,
                            <p><strong>Paso 1:</strong> Calcula primero <span className="text-indigo-600 font-black">{numA} × 5</span> (la mitad de {numA * 10}): ¡eso es <span className="bg-indigo-600 text-white px-2.5 py-0.5 rounded-xl font-black">{x5}</span>! ⚡</p>,
                            <p><strong>Paso 2:</strong> Ahora súmale una vez el número original (<span className="bg-emerald-500 text-white px-2.5 py-0.5 rounded-xl font-black">{x5} + {numA}</span>). ➕</p>,
                            <p><strong>¡Victoria Sónica!:</strong> {x5} + {numA} = <span className="text-amber-500 font-black">{ans}</span>. ¡Dominaste la descomposición! 🏆</p>
                        ]
                    };
                }
                default:
                    return { maxSteps: 3, ans: numA * numB, explanations: [] };
            }
        };

        function App() {
            const [view, setView] = useState('home');
            const [mode, setMode] = useState('trick1');
            const [step, setStep] = useState(0);

            const [exIndex, setExIndex] = useState(0);
            const [numA, setNumA] = useState(34);
            const [numB, setNumB] = useState(10);

            const [isMuted, setIsMuted] = useState(false);

            const [isPracticeMode, setIsPracticeMode] = useState(false);
            const [practiceIndex, setPracticeIndex] = useState(0);
            const [rings, setRings] = useState(0);
            const [userAnswer, setUserAnswer] = useState('');
            const [feedbackStatus, setFeedbackStatus] = useState(null);
            const [showPointsAnim, setShowPointsAnim] = useState(false);

            const handleInteraction = () => AudioController.init();

            const loadExercise = (selectedMode, newIndex, isPractice = false) => {
                const arr = isPractice ? PRACTICE_EXERCISES[selectedMode] : EXERCISES[selectedMode];
                const safeIndex = ((newIndex % arr.length) + arr.length) % arr.length;
                setNumA(arr[safeIndex][0]);
                setNumB(arr[safeIndex][1]);
                if (isPractice) {
                    setPracticeIndex(safeIndex);
                    setUserAnswer('');
                    setFeedbackStatus(null);
                } else {
                    setExIndex(safeIndex);
                }
            };

            const generateExample = (selectedMode = null, customIdx = null) => {
                handleInteraction();
                const currentMode = selectedMode || mode;
                setStep(0);
                AudioController.play('pop');
                const newIndex = customIdx !== null ? customIdx : (selectedMode ? 0 : exIndex + 1);
                loadExercise(currentMode, newIndex, false);
            };

            const togglePracticeMode = () => {
                handleInteraction();
                AudioController.play('swoosh');
                const newIsPractice = !isPracticeMode;
                setIsPracticeMode(newIsPractice);
                setStep(0);
                if (newIsPractice) loadExercise(mode, practiceIndex, true);
                else loadExercise(mode, exIndex, false);
            };

            const nextPractice = () => {
                handleInteraction();
                AudioController.play('pop');
                loadExercise(mode, practiceIndex + 1, true);
            };

            const trickData = getTrickData(mode, numA, numB);
            const maxSteps = trickData.maxSteps;

            const checkAnswer = () => {
                handleInteraction();
                if (!userAnswer.trim()) return;
                const correctAns = numA * numB;

                if (parseInt(userAnswer, 10) === correctAns) {
                    AudioController.play('ring');
                    setTimeout(() => AudioController.play('success'), 150);
                    setFeedbackStatus('success');
                    setRings(r => r + 50);
                    setShowPointsAnim(true);
                    setTimeout(() => setShowPointsAnim(false), 1800);
                } else {
                    AudioController.play('pop-reverse');
                    setFeedbackStatus('error');
                }
            };

            const enterLab = (newMode) => {
                handleInteraction();
                AudioController.play('swoosh');
                setMode(newMode);
                setView('lab');
                setIsPracticeMode(false);
                generateExample(newMode, 0);
            };

            const goHome = () => {
                handleInteraction();
                AudioController.play('swoosh');
                setView('home');
                setStep(0);
            };

            const toggleMute = () => {
                handleInteraction();
                setIsMuted(AudioController.toggleMute());
            };

            const nextStep = () => {
                handleInteraction();
                if (step < maxSteps) {
                    const next = step + 1;
                    setStep(next);
                    if (next === maxSteps) {
                        AudioController.play('ring');
                        setTimeout(() => AudioController.play('success'), 120);
                        setRings(r => r + 10);
                    } else {
                        AudioController.play('pop');
                    }
                }
            };

            const prevStep = () => {
                handleInteraction();
                if (step > 0) {
                    setStep(step - 1);
                    AudioController.play('pop-reverse');
                }
            };

            const currentTrickMeta = TRICKS_INFO.find(t => t.id === mode) || TRICKS_INFO[0];

            const renderExplanation = () => {
                if (isPracticeMode) {
                    if (feedbackStatus === 'success') {
                        return <p>¡Súper Sónico! 🦔💨 Ganaste <span className="text-amber-500 font-black">+50 Anillos Dorados</span>. ¡Calculaste {numA} × {numB} = {numA * numB} a toda velocidad!</p>;
                    }
                    if (feedbackStatus === 'error') {
                        return <p>¡Casi! 💫 Usa el truco de <strong>{currentTrickMeta.title}</strong> ({currentTrickMeta.subtitle}) e inténtalo de nuevo.</p>;
                    }
                    return <p>¡Reto de Velocidad! ⚡ Calcula mentalmente <strong>{numA} × {numB}</strong> usando el truco y presiona <strong>¡Comprobar!</strong></p>;
                }
                return trickData.explanations[step] || <p>¡Listo para correr a toda velocidad!</p>;
            };

            // Renderizador visual interactivo del pizarrón según el truco y el paso
            const renderVisualBoard = () => {
                // TRUCO 1: x10, x100, x1000
                if (mode === 'trick1') {
                    return (
                        <div className="flex flex-wrap items-center justify-center text-3xl sm:text-6xl md:text-7xl lg:text-8xl font-black gap-x-2.5 sm:gap-x-4 gap-y-8 w-full py-4">
                            <span className={step >= 2 ? "text-indigo-600 scale-105 transition-transform" : "text-slate-800"}>{numA}</span>
                            <span className="text-slate-400">×</span>
                            <div className="relative flex items-center">
                                <span className="text-slate-800">1</span>
                                <span className={step >= 1 ? "text-amber-500 bg-amber-100 px-2 rounded-xl sm:rounded-2xl border-2 border-amber-400 animate-pulse" : "text-slate-800"}>
                                    {trickData.zerosStr}
                                </span>
                                {step === 1 && (
                                    <div className="absolute top-[115%] left-1/2 -translate-x-1/2 text-xs sm:text-xl md:text-2xl text-amber-900 bg-amber-200 px-3 sm:px-4 py-1 rounded-full border-2 border-amber-500 animate-jellyPop whitespace-nowrap shadow-md z-30">
                                        {trickData.zerosCount} {trickData.zerosCount === 1 ? 'cero' : 'ceros'}
                                    </div>
                                )}
                            </div>
                            <span className="text-rose-500">=</span>

                            <div className="flex items-center relative">
                                {step === 0 && <span className="text-slate-200 animate-wiggle">?</span>}
                                {step === 1 && <span className="text-slate-300 animate-pulse">...</span>}
                                {step === 2 && (
                                    <div className="flex items-center animate-jellyPop">
                                        <span className="text-indigo-600">{numA}</span>
                                        <span className="text-emerald-600 bg-emerald-100 px-2 rounded-xl sm:rounded-2xl border-2 border-emerald-400 ml-1">{trickData.zerosStr}</span>
                                    </div>
                                )}
                                {step === maxSteps && (
                                    <div className="bg-[#fde047] text-slate-900 border-[4px] sm:border-[7px] border-[#eab308] rounded-[1.2rem] sm:rounded-[2.2rem] px-4 sm:px-8 py-1 sm:py-1.5 shadow-xl animate-jellyPop">
                                        {trickData.ans}
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                }

                // TRUCO 4: Multiplicar por 4 (Doble 2 veces)
                if (mode === 'trick4') {
                    return (
                        <div className="flex flex-col items-center justify-center gap-4 sm:gap-6 w-full py-2">
                            <div className="flex flex-wrap items-center justify-center text-3xl sm:text-6xl md:text-7xl font-black gap-2 sm:gap-3">
                                <span className="text-indigo-600">{numA}</span>
                                <span className="text-slate-400">× 4 =</span>
                                {step < maxSteps ? (
                                    <span className="text-slate-200 animate-wiggle">?</span>
                                ) : (
                                    <div className="bg-[#fde047] text-slate-900 border-[4px] sm:border-[5px] border-[#eab308] rounded-[1.2rem] sm:rounded-[1.5rem] px-4 sm:px-5 py-1 shadow-xl animate-jellyPop">
                                        {trickData.ans}
                                    </div>
                                )}
                            </div>

                            {/* Cadena de dobles */}
                            <div className="flex flex-wrap items-center justify-center gap-2 sm:gap-4 mt-1">
                                <div className="px-3.5 sm:px-6 py-2 sm:py-3 rounded-2xl bg-indigo-100 border-2 sm:border-[3px] border-indigo-400 text-indigo-800 text-xl sm:text-4xl font-black shadow-sm">
                                    {numA}
                                </div>

                                {step >= 1 && (
                                    <Fragment>
                                        <div className="flex flex-col items-center animate-jellyPop">
                                            <span className="text-[10px] sm:text-sm font-black bg-cyan-500 text-white px-2 sm:px-2.5 py-0.5 rounded-full shadow">×2 (Doble 1)</span>
                                            <span className="text-xl sm:text-4xl text-cyan-500 font-black leading-none mt-0.5">➔</span>
                                        </div>
                                        <div className="px-3.5 sm:px-6 py-2 sm:py-3 rounded-2xl bg-cyan-100 border-2 sm:border-[3px] border-cyan-400 text-cyan-900 text-xl sm:text-4xl font-black shadow-md animate-jellyPop">
                                            {trickData.d1}
                                        </div>
                                    </Fragment>
                                )}

                                {step >= 2 && (
                                    <Fragment>
                                        <div className="flex flex-col items-center animate-jellyPop">
                                            <span className="text-[10px] sm:text-sm font-black bg-emerald-500 text-white px-2 sm:px-2.5 py-0.5 rounded-full shadow">×2 (Doble 2)</span>
                                            <span className="text-xl sm:text-4xl text-emerald-500 font-black leading-none mt-0.5">➔</span>
                                        </div>
                                        <div className={`px-3.5 sm:px-6 py-2 sm:py-3 rounded-2xl border-2 sm:border-[3px] text-xl sm:text-4xl font-black shadow-md animate-jellyPop ${step === maxSteps ? 'bg-amber-300 border-amber-500 text-slate-900 scale-105' : 'bg-emerald-100 border-emerald-400 text-emerald-900'}`}>
                                            {trickData.ans}
                                        </div>
                                    </Fragment>
                                )}
                            </div>
                        </div>
                    );
                }

                // TRUCO 5: Multiplicar por 8 (Doble 3 veces)
                if (mode === 'trick5') {
                    return (
                        <div className="flex flex-col items-center justify-center gap-4 sm:gap-6 w-full py-2">
                            <div className="flex flex-wrap items-center justify-center text-3xl sm:text-6xl md:text-7xl font-black gap-2 sm:gap-3">
                                <span className="text-indigo-600">{numA}</span>
                                <span className="text-slate-400">× 8 =</span>
                                {step < maxSteps ? (
                                    <span className="text-slate-200 animate-wiggle">?</span>
                                ) : (
                                    <div className="bg-[#fde047] text-slate-900 border-[4px] sm:border-[5px] border-[#eab308] rounded-[1.2rem] sm:rounded-[1.5rem] px-4 sm:px-5 py-1 shadow-xl animate-jellyPop">
                                        {trickData.ans}
                                    </div>
                                )}
                            </div>

                            {/* Cadena de 3 dobles */}
                            <div className="flex flex-wrap items-center justify-center gap-1.5 sm:gap-3">
                                <div className="px-3 sm:px-5 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl bg-slate-100 border-2 border-slate-300 text-slate-800 text-lg sm:text-3xl md:text-4xl font-black">
                                    {numA}
                                </div>

                                {step >= 1 && (
                                    <Fragment>
                                        <div className="flex flex-col items-center animate-jellyPop">
                                            <span className="text-[10px] sm:text-xs font-black bg-cyan-500 text-white px-1.5 sm:px-2 py-0.5 rounded-full">×2</span>
                                            <span className="text-lg sm:text-3xl text-cyan-500 font-black leading-none">➔</span>
                                        </div>
                                        <div className="px-3 sm:px-5 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl bg-cyan-100 border-2 border-cyan-400 text-cyan-900 text-lg sm:text-3xl md:text-4xl font-black animate-jellyPop">
                                            {trickData.d1}
                                        </div>
                                    </Fragment>
                                )}

                                {step >= 2 && (
                                    <Fragment>
                                        <div className="flex flex-col items-center animate-jellyPop">
                                            <span className="text-[10px] sm:text-xs font-black bg-indigo-500 text-white px-1.5 sm:px-2 py-0.5 rounded-full">×2</span>
                                            <span className="text-lg sm:text-3xl text-indigo-500 font-black leading-none">➔</span>
                                        </div>
                                        <div className="px-3 sm:px-5 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl bg-indigo-100 border-2 border-indigo-400 text-indigo-900 text-lg sm:text-3xl md:text-4xl font-black animate-jellyPop">
                                            {trickData.d2}
                                        </div>
                                    </Fragment>
                                )}

                                {step >= 3 && (
                                    <Fragment>
                                        <div className="flex flex-col items-center animate-jellyPop">
                                            <span className="text-[10px] sm:text-xs font-black bg-emerald-500 text-white px-1.5 sm:px-2 py-0.5 rounded-full">×2</span>
                                            <span className="text-lg sm:text-3xl text-emerald-500 font-black leading-none">➔</span>
                                        </div>
                                        <div className={`px-3 sm:px-5 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl border-2 text-lg sm:text-3xl md:text-4xl font-black animate-jellyPop ${step === maxSteps ? 'bg-amber-300 border-amber-500 text-slate-900 scale-105 shadow-lg' : 'bg-emerald-100 border-emerald-400 text-emerald-900'}`}>
                                            {trickData.ans}
                                        </div>
                                    </Fragment>
                                )}
                            </div>
                        </div>
                    );
                }

                // TRUCO 6: Multiplicar por 9 (Una cifra)
                if (mode === 'trick6') {
                    return (
                        <div className="flex flex-wrap items-center justify-center text-4xl sm:text-7xl md:text-8xl font-black gap-x-3 sm:gap-x-4 gap-y-10 w-full py-5">
                            <div className="relative flex flex-col items-center">
                                <span className="text-indigo-600">{numA}</span>
                                {step === 1 && (
                                    <div className="absolute top-[112%] text-xs sm:text-2xl text-indigo-900 bg-indigo-100 px-3 sm:px-3.5 py-1 rounded-full border-2 border-indigo-400 animate-jellyPop whitespace-nowrap shadow-md z-30">
                                        {numA} − 1 = {trickData.left}
                                    </div>
                                )}
                            </div>
                            <span className="text-slate-400">× 9 =</span>

                            {step === 0 && <span className="text-slate-200 animate-wiggle">?</span>}

                            {step > 0 && step < maxSteps && (
                                <div className="flex items-center gap-2">
                                    <div className="relative flex flex-col items-center">
                                        <span className="text-indigo-600 bg-indigo-50 px-3 sm:px-4 py-1 rounded-2xl border-2 border-indigo-300 animate-jellyPop">{trickData.left}</span>
                                    </div>
                                    {step >= 2 && (
                                        <div className="relative flex flex-col items-center">
                                            <span className="text-emerald-600 bg-emerald-50 px-3 sm:px-4 py-1 rounded-2xl border-2 border-emerald-300 animate-jellyPop">{trickData.right}</span>
                                            <div className="absolute top-[112%] text-xs sm:text-2xl text-emerald-900 bg-emerald-100 px-3 sm:px-3.5 py-1 rounded-full border-2 border-emerald-400 animate-jellyPop whitespace-nowrap shadow-md z-30">
                                                9 − {trickData.left} = {trickData.right}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {step === maxSteps && (
                                <div className="bg-[#fde047] text-slate-900 border-[4px] sm:border-[7px] border-[#eab308] rounded-[1.2rem] sm:rounded-[2.2rem] px-5 sm:px-6 py-1 sm:py-1.5 shadow-xl animate-jellyPop">
                                    {trickData.ans}
                                </div>
                            )}
                        </div>
                    );
                }

                // TRUCO 7: Multiplicar por 9 (Cualquier número: x10 - N)
                if (mode === 'trick7') {
                    return (
                        <div className="flex flex-col items-center justify-center gap-4 sm:gap-6 w-full py-2">
                            <div className="flex flex-wrap items-center justify-center text-3xl sm:text-6xl md:text-7xl font-black gap-2 sm:gap-3">
                                <span className="text-indigo-600">{numA}</span>
                                <span className="text-slate-400">× 9 =</span>
                                {step < maxSteps ? (
                                    <span className="text-slate-200 animate-wiggle">?</span>
                                ) : (
                                    <div className="bg-[#fde047] text-slate-900 border-[4px] sm:border-[5px] border-[#eab308] rounded-[1.2rem] sm:rounded-[1.5rem] px-4 sm:px-6 py-1 shadow-xl animate-jellyPop">
                                        {trickData.ans}
                                    </div>
                                )}
                            </div>

                            {step >= 1 && (
                                <div className="flex flex-wrap items-center justify-center gap-2 sm:gap-3 text-xl sm:text-4xl md:text-5xl font-black animate-jellyPop">
                                    <div className="bg-indigo-100 border-2 border-indigo-400 text-indigo-800 px-3 sm:px-4 py-1.5 sm:py-2 rounded-2xl shadow-sm flex flex-col items-center">
                                        <span>{trickData.times10}</span>
                                        <span className="text-[10px] sm:text-sm text-indigo-500 font-bold">({numA} × 10)</span>
                                    </div>

                                    {step >= 2 && (
                                        <Fragment>
                                            <span className="text-rose-500 text-2xl sm:text-5xl">−</span>
                                            <div className="bg-rose-100 border-2 border-rose-400 text-rose-800 px-3 sm:px-4 py-1.5 sm:py-2 rounded-2xl shadow-sm flex flex-col items-center animate-jellyPop">
                                                <span>{numA}</span>
                                                <span className="text-[10px] sm:text-sm text-rose-500 font-bold">(× 1)</span>
                                            </div>
                                        </Fragment>
                                    )}

                                    {step === maxSteps && (
                                        <Fragment>
                                            <span className="text-emerald-600">=</span>
                                            <span className="text-emerald-600 bg-emerald-100 border-2 border-emerald-400 px-3 sm:px-4 py-1.5 sm:py-2 rounded-2xl animate-jellyPop">{trickData.ans}</span>
                                        </Fragment>
                                    )}
                                </div>
                            )}
                        </div>
                    );
                }

                // TRUCO 8: Multiplicar por 11 (Una cifra)
                if (mode === 'trick8') {
                    return (
                        <div className="flex flex-wrap items-center justify-center text-4xl sm:text-7xl md:text-8xl font-black gap-x-3 sm:gap-x-4 gap-y-6 w-full py-4">
                            <span className="text-indigo-600">{numA}</span>
                            <span className="text-slate-400">× 11 =</span>

                            {step === 0 && <span className="text-slate-200 animate-wiggle">?</span>}

                            {step === 1 && (
                                <div className="flex items-center gap-2 animate-jellyPop">
                                    <span className="bg-indigo-100 text-indigo-700 border-2 border-indigo-400 px-3.5 sm:px-4 py-1 rounded-2xl">{numA}</span>
                                    <span className="bg-emerald-100 text-emerald-700 border-2 border-emerald-400 px-3.5 sm:px-4 py-1 rounded-2xl">{numA}</span>
                                </div>
                            )}

                            {step === maxSteps && (
                                <div className="bg-[#fde047] text-slate-900 border-[4px] sm:border-[7px] border-[#eab308] rounded-[1.2rem] sm:rounded-[2.2rem] px-5 sm:px-6 py-1 sm:py-1.5 shadow-xl animate-jellyPop">
                                    {trickData.ans}
                                </div>
                            )}
                        </div>
                    );
                }

                // TRUCO 9: Multiplicar por 11 (Dos cifras ab -> a (a+b) b)
                if (mode === 'trick9') {
                    return (
                        <div className="flex flex-wrap items-center justify-center text-3xl sm:text-6xl md:text-7xl lg:text-8xl font-black gap-x-2.5 sm:gap-x-3 gap-y-10 w-full py-5">
                            <div className="flex items-center">
                                <span className="text-indigo-600">{trickData.a}</span>
                                <span className="text-sky-600">{trickData.b}</span>
                            </div>
                            <span className="text-slate-400">× 11 =</span>

                            {step === 0 && <span className="text-slate-200 animate-wiggle">?</span>}

                            {step > 0 && step < maxSteps && (
                                <div className="flex items-center gap-1.5 sm:gap-3 animate-jellyPop relative">
                                    <span className="bg-indigo-100 text-indigo-700 border-2 border-indigo-400 px-3 sm:px-3.5 py-1 rounded-2xl">{trickData.a}</span>
                                    
                                    <div className="relative flex flex-col items-center">
                                        {step === 1 ? (
                                            <span className="w-10 sm:w-16 h-10 sm:h-16 rounded-2xl border-4 border-dashed border-slate-300 flex items-center justify-center text-slate-300 text-2xl sm:text-3xl">?</span>
                                        ) : (
                                            <span className="bg-emerald-100 text-emerald-700 border-2 border-emerald-400 px-3 sm:px-3.5 py-1 rounded-2xl animate-jellyPop">{trickData.mid}</span>
                                        )}
                                        {step === 2 && (
                                            <div className="absolute top-[115%] text-xs sm:text-2xl text-emerald-900 bg-emerald-200 px-3 sm:px-3.5 py-1 rounded-full border-2 border-emerald-500 animate-jellyPop whitespace-nowrap shadow-md z-30">
                                                {trickData.a} + {trickData.b} = {trickData.mid}
                                            </div>
                                        )}
                                    </div>

                                    <span className="bg-sky-100 text-sky-700 border-2 border-sky-400 px-3 sm:px-3.5 py-1 rounded-2xl">{trickData.b}</span>
                                </div>
                            )}

                            {step === maxSteps && (
                                <div className="bg-[#fde047] text-slate-900 border-[4px] sm:border-[7px] border-[#eab308] rounded-[1.2rem] sm:rounded-[2.2rem] px-5 sm:px-6 py-1 sm:py-1.5 shadow-xl animate-jellyPop">
                                    {trickData.ans}
                                </div>
                            )}
                        </div>
                    );
                }

                // TRUCO 10: Multiplicar por 6 (6 = 5 + 1)
                if (mode === 'trick10') {
                    return (
                        <div className="flex flex-col items-center justify-center gap-4 sm:gap-6 w-full py-2">
                            <div className="flex flex-wrap items-center justify-center text-3xl sm:text-6xl md:text-7xl font-black gap-2 sm:gap-3">
                                <span className="text-indigo-600">{numA}</span>
                                <span className="text-slate-400">× 6 =</span>
                                {step < maxSteps ? (
                                    <span className="text-slate-200 animate-wiggle">?</span>
                                ) : (
                                    <div className="bg-[#fde047] text-slate-900 border-[4px] sm:border-[5px] border-[#eab308] rounded-[1.2rem] sm:rounded-[1.5rem] px-4 sm:px-6 py-1 shadow-xl animate-jellyPop">
                                        {trickData.ans}
                                    </div>
                                )}
                            </div>

                            {step >= 1 && (
                                <div className="flex flex-wrap items-center justify-center gap-2 sm:gap-3 text-xl sm:text-4xl md:text-5xl font-black animate-jellyPop">
                                    <div className="bg-indigo-100 border-2 border-indigo-400 text-indigo-800 px-3 sm:px-4 py-1.5 sm:py-2 rounded-2xl shadow-sm flex flex-col items-center">
                                        <span>{trickData.x5}</span>
                                        <span className="text-[10px] sm:text-sm text-indigo-500 font-bold">({numA} × 5)</span>
                                    </div>

                                    {step >= 2 && (
                                        <Fragment>
                                            <span className="text-emerald-600 text-2xl sm:text-5xl">+</span>
                                            <div className="bg-emerald-100 border-2 border-emerald-400 text-emerald-800 px-3 sm:px-4 py-1.5 sm:py-2 rounded-2xl shadow-sm flex flex-col items-center animate-jellyPop">
                                                <span>{numA}</span>
                                                <span className="text-[10px] sm:text-sm text-emerald-600 font-bold">({numA} × 1)</span>
                                            </div>
                                        </Fragment>
                                    )}

                                    {step === maxSteps && (
                                        <Fragment>
                                            <span className="text-amber-500">=</span>
                                            <span className="text-amber-900 bg-amber-200 border-2 border-amber-500 px-3 sm:px-4 py-1.5 sm:py-2 rounded-2xl animate-jellyPop">{trickData.ans}</span>
                                        </Fragment>
                                    )}
                                </div>
                            )}
                        </div>
                    );
                }

                return null;
            };

            if (view === 'home') {
                return (
                    <div className="min-h-[100dvh] w-full bg-gradient-to-br from-[#0f172a] via-[#1d4ed8] to-[#1e1b4b] flex flex-col justify-between p-3 sm:p-6 md:p-8 relative font-fun overflow-x-hidden overflow-y-auto">
                        <InteractiveSonicBackground />
                        
                        {/* Responsive Top Navigation Bar */}
                        <header className="relative z-20 w-full max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 py-1">
                            <div className="inline-flex items-center gap-1.5 sm:gap-2 px-3.5 sm:px-5 py-1.5 sm:py-2 rounded-full border-2 border-yellow-400/70 bg-blue-950/70 backdrop-blur-md text-yellow-300 text-xs sm:text-sm font-black tracking-wider uppercase shadow-xl">
                                <Zap className="w-4 h-4 sm:w-5 sm:h-5 fill-current" /> TuProfe20 Lab • 4.º Primaria
                            </div>

                            <div className="flex items-center gap-2 sm:gap-3">
                                <div className="flex items-center gap-1.5 sm:gap-2 bg-amber-400/95 backdrop-blur-md px-3 sm:px-4 py-1.5 sm:py-2 rounded-2xl border-2 border-yellow-200 text-slate-900 text-xs sm:text-base font-black shadow-lg">
                                    <span className="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full border-[3px] border-slate-900 inline-block animate-spin" />
                                    <span>Anillos: {rings}</span>
                                </div>
                                <button onClick={toggleMute} className="p-2.5 sm:p-3 rounded-2xl bg-white/15 backdrop-blur-md shadow-lg text-white hover:bg-white/25 transition-all hover:scale-105 active:scale-95">
                                    {isMuted ? <VolumeX className="w-5 h-5" /> : <Volume2 className="w-5 h-5" />}
                                </button>
                            </div>
                        </header>

                        {/* Main Hero & Grid */}
                        <main className="relative z-10 text-center w-full max-w-7xl mx-auto my-auto py-3 sm:py-6">
                            <div className="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-6 mb-4 sm:mb-6">
                                <SonicAssistant size="hero" step={0} maxSteps={3} isPracticeMode={false} feedbackStatus={null} onPoke={() => setRings(r => r + 5)} />
                                <div className="text-center sm:text-left max-w-2xl">
                                    <h1 className="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 via-amber-400 to-orange-500 drop-shadow-[0_6px_6px_rgba(0,0,0,0.65)] leading-tight">
                                        Trucos de Multiplicación
                                    </h1>
                                    <p className="text-xs sm:text-base md:text-xl text-cyan-200 font-bold mt-1.5 px-2 sm:px-0">
                                        ¡Domina el cálculo mental a la velocidad de Sonic! (Toca a Sonic para hacer un Spin Dash) 🦔💨
                                    </p>
                                </div>
                            </div>

                            {/* Grid Adaptable de 8 Trucos */}
                            <div className="grid grid-cols-1 xs:grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 md:gap-5 px-1 sm:px-2 w-full">
                                {TRICKS_INFO.map((t) => (
                                    <button
                                        key={t.id}
                                        onClick={() => enterLab(t.id)}
                                        className={`group text-left p-4 sm:p-5 rounded-[1.5rem] sm:rounded-[2rem] bg-gradient-to-br ${t.gradient} border-[3px] ${t.border} backdrop-blur-xl hover:-translate-y-1.5 active:scale-98 ${t.shadow} transition-all flex flex-col justify-between min-h-[8.5rem] sm:h-44 relative overflow-hidden`}
                                    >
                                        <div className="absolute -bottom-2 -right-1 text-4xl sm:text-5xl font-black text-white/15 group-hover:text-white/30 group-hover:scale-110 transition-all select-none">
                                            {t.badge}
                                        </div>
                                        <div>
                                            <div className="flex items-center justify-between gap-2 mb-1">
                                                <span className="text-[10px] sm:text-xs font-black uppercase tracking-wider bg-black/35 text-yellow-300 px-2.5 sm:px-3 py-0.5 sm:py-1 rounded-full border border-yellow-400/40">
                                                    {t.number}
                                                </span>
                                                <span className="text-[10px] sm:text-[11px] font-bold text-white/85 truncate">
                                                    {t.level}
                                                </span>
                                            </div>
                                            <h3 className="text-lg sm:text-2xl font-black text-white mt-1 drop-shadow-md leading-tight">
                                                {t.title}
                                            </h3>
                                        </div>
                                        <p className="text-white/95 text-xs sm:text-sm font-bold leading-snug pr-8 mt-2">
                                            {t.subtitle}
                                        </p>
                                    </button>
                                ))}
                            </div>
                        </main>

                        <footer className="relative z-10 text-center text-cyan-200/70 text-xs font-bold py-1">
                            TuProfe20 • Matemática que se entiende y se practica en cualquier dispositivo
                        </footer>
                    </div>
                );
            }

            return (
                <div className="min-h-[100dvh] w-full bg-gradient-to-br from-[#0f172a] via-[#1e40af] to-[#3b0764] text-slate-800 flex flex-col p-2 sm:p-3 md:p-4 relative font-fun overflow-x-hidden overflow-y-auto">
                    <InteractiveSonicBackground />
                    {!isPracticeMode && step === maxSteps && <Confetti />}

                    {/* Header bar */}
                    <div className="shrink-0 relative z-10 w-full max-w-6xl mx-auto flex justify-between items-center mb-1.5 sm:mb-3 px-1 gap-2">
                        <button onClick={goHome} className="flex items-center justify-center px-3 py-2 sm:px-4 sm:py-2 rounded-xl sm:rounded-2xl bg-white/15 border-2 border-white/35 backdrop-blur-md text-white font-black hover:bg-white/25 transition-all shadow-md active:scale-95">
                            <Home className="w-4 h-4 sm:w-5 sm:h-5 sm:mr-1.5" />
                            <span className="hidden xs:inline text-xs sm:text-base ml-1 sm:ml-0">Menú</span>
                        </button>

                        <div className="flex flex-col items-center min-w-0 px-1">
                            <span className="text-[9px] sm:text-xs font-black uppercase tracking-widest text-yellow-300 truncate max-w-full">
                                {currentTrickMeta.number} • {currentTrickMeta.level}
                            </span>
                            <h2 className="text-sm sm:text-2xl md:text-3xl font-black text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)] text-center truncate max-w-full">
                                {currentTrickMeta.title}
                            </h2>
                        </div>

                        <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                            <div className="flex items-center gap-1.5 bg-amber-400 px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl border-2 border-yellow-200 text-slate-900 font-black shadow-md">
                                <span className="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full border-[3px] border-slate-900 inline-block animate-spin" />
                                <span className="text-xs sm:text-base">{rings}</span>
                            </div>
                            <button onClick={toggleMute} className="p-2 sm:p-2.5 rounded-xl sm:rounded-2xl bg-white/15 border-2 border-white/35 backdrop-blur-md text-white hover:bg-white/25 transition-all shadow-md">
                                {isMuted ? <VolumeX className="w-4 h-4 sm:w-5 sm:h-5" /> : <Volume2 className="w-4 h-4 sm:w-5 sm:h-5" />}
                            </button>
                        </div>
                    </div>

                    {/* Main Interactive Card */}
                    <div className="flex-1 flex flex-col justify-between relative z-10 w-full max-w-6xl mx-auto bg-white rounded-[1.25rem] sm:rounded-[2.2rem] border-[3px] sm:border-[6px] border-white shadow-[0_20px_50px_rgba(0,0,0,0.5)] overflow-hidden my-auto">
                        
                        {/* Quick Example Selector Pills */}
                        <div className="shrink-0 bg-slate-100/95 border-b-2 border-slate-200 px-2.5 sm:px-4 py-1.5 sm:py-2 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar">
                            <span className="text-[11px] sm:text-sm font-black text-slate-500 uppercase tracking-wider shrink-0">
                                {isPracticeMode ? '🎯 Retos:' : '📘 Ejemplos:'}
                            </span>
                            <div className="flex items-center gap-1 sm:gap-1.5">
                                {(isPracticeMode ? PRACTICE_EXERCISES[mode] : EXERCISES[mode]).map((pair, idx) => {
                                    const activeIdx = isPracticeMode ? practiceIndex : exIndex;
                                    const isCurrent = idx === activeIdx;
                                    return (
                                        <button
                                            key={idx}
                                            onClick={() => {
                                                handleInteraction();
                                                AudioController.play('pop');
                                                setStep(0);
                                                loadExercise(mode, idx, isPracticeMode);
                                            }}
                                            className={`px-2 sm:px-2.5 py-1 rounded-lg sm:rounded-xl text-[11px] sm:text-sm font-black transition-all shrink-0 ${
                                                isCurrent
                                                    ? 'bg-blue-600 text-white shadow-sm scale-105'
                                                    : 'bg-white text-slate-600 hover:bg-blue-50 border border-slate-200'
                                            }`}
                                        >
                                            #{idx + 1} ({pair[0]}×{pair[1]})
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Math Stage */}
                        <div className="flex-1 min-h-[11rem] sm:min-h-[15rem] flex flex-col items-center justify-center p-3 sm:p-6 relative bg-slate-50 overflow-y-auto w-full">
                            <div className="absolute inset-0 opacity-5 bg-[radial-gradient(#1e40af_2px,transparent_2px)] [background-size:24px_24px] pointer-events-none"></div>

                            {!isPracticeMode && step === maxSteps && (
                                <div className="absolute top-2 right-2 sm:top-3 sm:right-3 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-900 font-black px-3 py-1 sm:px-4 sm:py-1.5 rounded-xl animate-bounce shadow-lg border-2 border-yellow-200 flex items-center gap-1 text-xs sm:text-base z-20">
                                    <Star fill="currentColor" className="w-4 h-4 sm:w-5 sm:h-5"/> ¡Super Sonic! +10 Anillos
                                </div>
                            )}

                            <div className="w-full flex items-center justify-center px-1 sm:px-4 max-w-full z-10 my-auto">
                                {!isPracticeMode ? (
                                    renderVisualBoard()
                                ) : (
                                    <div className="flex flex-col items-center justify-center w-full relative py-2">
                                        {showPointsAnim && <GoldenRingsExplosion />}
                                        {showPointsAnim && (
                                            <div className="absolute -top-10 left-1/2 -translate-x-1/2 flex items-center justify-center pointer-events-none z-50 animate-pointsFloat">
                                                <span className="text-2xl sm:text-5xl font-black text-amber-500 drop-shadow-[0_4px_4px_white]">+50 Anillos</span>
                                            </div>
                                        )}

                                        <div className="flex items-center justify-center text-3xl sm:text-6xl md:text-7xl font-black whitespace-nowrap bg-white px-4 py-4 sm:px-10 sm:py-7 rounded-[1.5rem] sm:rounded-[2rem] shadow-[0_8px_30px_rgba(0,0,0,0.06)] border-[3px] border-slate-100 flex-wrap gap-x-2.5 sm:gap-x-4 gap-y-3 max-w-full z-10">
                                            <span className="text-[#2563eb]">{numA}</span>
                                            <span className="text-slate-400">×</span>
                                            <span className="text-[#2563eb]">{numB}</span>
                                            <span className="text-[#f43f5e]">=</span>

                                            {feedbackStatus === 'success' ? (
                                                <span className="text-[#10b981] animate-jellyPop inline-block text-center">{userAnswer}</span>
                                            ) : (
                                                <input
                                                    type="number"
                                                    inputMode="numeric"
                                                    value={userAnswer}
                                                    placeholder="?"
                                                    onChange={(e) => { setUserAnswer(e.target.value); setFeedbackStatus(null); }}
                                                    onKeyDown={(e) => e.key === 'Enter' && checkAnswer()}
                                                    className={`w-24 sm:w-44 text-center bg-slate-50 border-b-[5px] sm:border-b-[6px] rounded-xl sm:rounded-2xl outline-none transition-all focus:border-blue-500 focus:bg-blue-50/50 py-1 ${
                                                        feedbackStatus === 'error' ? 'border-rose-400 text-rose-500 animate-wiggle' : 'border-slate-300 text-[#10b981]'
                                                    }`}
                                                    autoFocus
                                                />
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Sonic Assistant & Explanation Banner */}
                        <div className="shrink-0 bg-white w-full px-2.5 py-2 sm:px-6 sm:py-3.5 flex items-center gap-2.5 sm:gap-5 border-t-[3px] sm:border-t-[4px] border-slate-200 z-10 relative">
                            <SonicAssistant
                                step={step}
                                maxSteps={maxSteps}
                                isPracticeMode={isPracticeMode}
                                feedbackStatus={feedbackStatus}
                                onPoke={() => setRings(r => r + 5)}
                            />
                            <div className="flex-1 text-sm sm:text-xl md:text-2xl font-bold text-slate-700 leading-snug bg-blue-50/80 p-2.5 sm:p-4 rounded-xl sm:rounded-2xl border-2 border-blue-100 min-h-[3.8rem] sm:min-h-[4.8rem] flex items-center">
                                <div key={isPracticeMode ? `${practiceIndex}-${feedbackStatus}` : `${exIndex}-${step}`} className="animate-slideInRight w-full">
                                    {renderExplanation()}
                                </div>
                            </div>
                        </div>

                        {/* Control Panel Footer */}
                        <div className="shrink-0 bg-gradient-to-b from-blue-100 to-indigo-200 p-2.5 sm:p-4 w-full flex flex-col items-center gap-2 sm:gap-2.5 border-t-[3px] sm:border-t-[4px] border-white z-10">
                            <div className="flex w-full max-w-3xl gap-2 sm:gap-3">
                                <button
                                    onClick={() => isPracticeMode ? togglePracticeMode() : generateExample()}
                                    className="flex-1 bg-white border-b-[4px] sm:border-b-[5px] border-slate-300 text-blue-700 rounded-xl sm:rounded-2xl py-2 sm:py-2.5 px-2 sm:px-3 font-black text-xs sm:text-lg md:text-xl flex items-center justify-center gap-1.5 sm:gap-2 active:border-b-0 active:translate-y-[4px] transition-all shadow-sm hover:bg-slate-50"
                                >
                                    <RotateCcw className="w-4 h-4 sm:w-6 sm:h-6 shrink-0" />
                                    <span className="truncate">{isPracticeMode ? 'Ver Ejemplos' : `Ejemplo (${exIndex + 1}/8)`}</span>
                                </button>

                                <button
                                    onClick={togglePracticeMode}
                                    className={`flex-1 border-b-[4px] sm:border-b-[5px] text-white rounded-xl sm:rounded-2xl py-2 sm:py-2.5 px-2 sm:px-3 font-black text-xs sm:text-lg md:text-xl flex items-center justify-center gap-1.5 sm:gap-2 transition-all shadow-sm active:border-b-0 active:translate-y-[4px] ${
                                        isPracticeMode
                                            ? 'bg-indigo-600 border-indigo-800 hover:brightness-110'
                                            : 'bg-emerald-500 border-emerald-700 hover:brightness-110'
                                    }`}
                                >
                                    <Rocket className="w-4 h-4 sm:w-6 sm:h-6 shrink-0" />
                                    <span className="truncate">{isPracticeMode ? 'Práctica Activa' : '¡A Practicar! (8)'}</span>
                                </button>
                            </div>

                            <div className="flex justify-center items-stretch w-full max-w-3xl gap-2 sm:gap-2.5 h-11 sm:h-14">
                                {!isPracticeMode ? (
                                    <Fragment>
                                        <button
                                            onClick={prevStep}
                                            disabled={step === 0}
                                            className="flex-[0.7] sm:flex-[0.8] bg-blue-200 border-b-[4px] sm:border-b-[5px] border-blue-400 text-blue-900 rounded-xl sm:rounded-2xl font-black text-xs sm:text-lg md:text-xl flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] disabled:opacity-40 transition-all hover:bg-blue-300"
                                        >
                                            <ChevronLeft className="w-5 h-5 sm:w-7 sm:h-7" />
                                            <span className="hidden xs:inline">Atrás</span>
                                        </button>

                                        <div className="bg-blue-700 text-white font-black px-3 sm:px-6 text-sm sm:text-xl flex items-center justify-center rounded-xl sm:rounded-2xl border-b-[4px] sm:border-b-[5px] border-blue-900 shadow-inner min-w-[3.8rem] sm:min-w-[4.5rem]">
                                            {step}/{maxSteps}
                                        </div>

                                        {step < maxSteps ? (
                                            <button
                                                onClick={nextStep}
                                                className="flex-[2] bg-gradient-to-r from-amber-400 to-orange-500 border-b-[4px] sm:border-b-[5px] border-orange-700 text-slate-900 rounded-xl sm:rounded-2xl font-black text-sm sm:text-xl md:text-2xl flex items-center justify-center gap-1.5 sm:gap-2 active:border-b-0 active:translate-y-[4px] transition-all hover:brightness-105 shadow-md"
                                            >
                                                <span>¡Siguiente Paso!</span> <ChevronRight className="w-5 h-5 sm:w-8 sm:h-8" />
                                            </button>
                                        ) : (
                                            <button
                                                onClick={() => generateExample()}
                                                className="flex-[2] bg-gradient-to-r from-emerald-400 to-teal-500 border-b-[4px] sm:border-b-[5px] border-teal-700 text-white rounded-xl sm:rounded-2xl font-black text-sm sm:text-xl md:text-2xl flex items-center justify-center gap-1.5 sm:gap-2 active:border-b-0 active:translate-y-[4px] transition-all hover:brightness-105 shadow-md animate-pulse"
                                            >
                                                <span>¡Siguiente Ejemplo!</span> <ChevronRight className="w-5 h-5 sm:w-8 sm:h-8" />
                                            </button>
                                        )}
                                    </Fragment>
                                ) : (
                                    <Fragment>
                                        <div className="bg-blue-700 text-white font-black px-3 sm:px-6 text-xs sm:text-xl flex items-center justify-center rounded-xl sm:rounded-2xl border-b-[4px] sm:border-b-[5px] border-blue-900 shadow-inner min-w-[5rem] sm:min-w-[6.5rem]">
                                            Reto {practiceIndex + 1}/8
                                        </div>
                                        {feedbackStatus !== 'success' ? (
                                            <button
                                                onClick={checkAnswer}
                                                className="flex-[2] bg-emerald-500 border-b-[4px] sm:border-b-[5px] border-emerald-700 text-white rounded-xl sm:rounded-2xl font-black text-sm sm:text-xl md:text-2xl flex items-center justify-center gap-1.5 sm:gap-2 active:border-b-0 active:translate-y-[4px] transition-all hover:brightness-110 shadow-md"
                                            >
                                                <span>¡Comprobar!</span> <Star className="w-4 h-4 sm:w-7 sm:h-7" fill="currentColor" />
                                            </button>
                                        ) : (
                                            <button
                                                onClick={nextPractice}
                                                className="flex-[2] bg-gradient-to-r from-amber-400 to-orange-500 border-b-[4px] sm:border-b-[5px] border-orange-700 text-slate-900 rounded-xl sm:rounded-2xl font-black text-sm sm:text-xl md:text-2xl flex items-center justify-center gap-1.5 sm:gap-2 active:border-b-0 active:translate-y-[4px] transition-all hover:brightness-110 shadow-md animate-pulse"
                                            >
                                                <span>Siguiente Reto</span> <ChevronRight className="w-5 h-5 sm:w-8 sm:h-8" />
                                            </button>
                                        )}
                                    </Fragment>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
